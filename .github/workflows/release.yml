name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=web

      - name: Build Next.js Monorepo
        env:
          NEXT_OUTPUT_STANDALONE: "true"
          SKIP_ENV_VALIDATION: "true"
          CI: "true"
        run: npm run build

      - name: Package Release Bundle
        run: |
          RELEASE_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="devmetric-${RELEASE_TAG}.tar.gz"
          echo "Packaging standalone build and static assets into ${ARCHIVE_NAME}..."

          tar -czf "${ARCHIVE_NAME}" \
            -C apps/web/.next standalone \
            -C ../static static 2>/dev/null || tar -czf "${ARCHIVE_NAME}" apps/web/.next/standalone apps/web/public

          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
        id: pkg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.release_tag }}
          name: DevMetric Release ${{ steps.pkg.outputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ steps.pkg.outputs.archive_name }}

      - name: Release Summary
        run: |
          echo "### 🎉 DevMetric Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${{ steps.pkg.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Asset:** \`${{ steps.pkg.outputs.archive_name }}\`" >> $GITHUB_STEP_SUMMARY
